<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notas y grados de estabilidad</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#203047;background:#f1f6fb}*{box-sizing:border-box}body{margin:0;padding:20px}.app{max-width:760px;margin:auto;background:#fff;border-radius:24px;padding:clamp(20px,4vw,36px);box-shadow:0 12px 35px #18365016}h1{margin:0;font-size:clamp(25px,5vw,36px)}.sub{color:#61738a;margin:5px 0 24px}.settings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{display:block;font-size:.9rem;font-weight:650;margin-bottom:5px}select,input[type=range]{width:100%}select{padding:10px;border:1px solid #c9d5e3;border-radius:10px;background:white;font:inherit}input[type=range]{accent-color:#417ec1}.display{min-height:285px;margin:24px 0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#eaf3fc;border-radius:22px;text-align:center;transition:background .2s}.display.active{background:#dceefd}.emoji{font-size:clamp(80px,18vw,128px);line-height:1.25}.note{font-size:clamp(34px,8vw,60px);font-weight:750;line-height:1.25}.hint{color:#60748c;font-size:1rem}.keys{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:9px}.keys button,.tonic{border:0;border-radius:12px;cursor:pointer;font:inherit;font-weight:700;touch-action:manipulation}.keys button{background:#397ec3;color:white;padding:15px 3px;font-size:clamp(14px,3vw,20px)}.keys button:active,.keys button.selected{background:#165b9e}.tonic{margin-top:17px;background:#e5f0fa;color:#1b5c9c;padding:12px 17px}.keys button:focus-visible,.tonic:focus-visible{outline:3px solid #f5a623;outline-offset:3px}.foot{font-size:.86rem;color:#64758b;margin:18px 0 0}@media(max-width:560px){.settings{grid-template-columns:repeat(2,minmax(0,1fr))}.settings>div:last-child{grid-column:1/-1}.keys{grid-template-columns:repeat(4,minmax(0,1fr))}.display{min-height:250px}}
</style>
</head>
<body><main class="app">
<h1>🎵 Notas y grados de estabilidad</h1><p class="sub">Tocá una nota o usá el teclado para escucharla y ver su expresión.</p>
<div class="settings"><div><label for="tonica">Tónica</label><select id="tonica"><option value="C">Do</option><option value="Db">Re♭</option><option value="D">Re</option><option value="Eb">Mi♭</option><option value="E">Mi</option><option value="F">Fa</option><option value="F#">Fa♯</option><option value="G">Sol</option><option value="Ab">La♭</option><option value="A">La</option><option value="Bb">Si♭</option><option value="B">Si</option></select></div><div><label for="timbre">Timbre</label><select id="timbre"><option value="sine">Senoidal</option><option value="triangle" selected>Triangular</option><option value="square">Cuadrada</option><option value="sawtooth">Sierra</option></select></div><div><label for="volumen">Volumen <span id="valorVolumen">70%</span></label><input type="range" id="volumen" min="0" max="100" value="70"></div></div>
<div id="display" class="display" role="status" aria-live="polite"><span id="emoji" class="emoji" aria-hidden="true">🎶</span><span id="nota" class="note">Elegí una nota</span><span id="ayuda" class="hint">Su nombre y emoji aparecerán aquí.</span></div>
<div id="teclado" class="keys" aria-label="Notas de la escala mayor"></div><button id="escucharTonica" class="tonic">♫ Escuchar la tónica</button>
<p class="foot">Atajos: d r m f s l t · Mayús + letra para la octava aguda · Alt + s/l/t para la grave. La escala es mayor.</p>
</main><script>
const notas=[['so.',-5,'😉'],['la.',-3,'🙁'],['ti.',-1,'😱'],['do',0,'😊'],['re',2,'😬'],['mi',4,'☺️'],['fa',5,'😨'],['so',7,'😉'],['la',9,'🙁'],['ti',11,'😱'],["do'",12,'😊'],["re'",14,'😬'],["mi'",16,'☺️'],["fa'",17,'😨'],["so'",19,'😉']];
const frecuencias={C:261.63,Db:277.18,D:293.66,Eb:311.13,E:329.63,F:349.23,'F#':369.99,G:392,Ab:415.30,A:440,Bb:466.16,B:493.88};
const $=id=>document.getElementById(id);
let contextoAudio,vozActual=null;
const pulsaciones=new Map();
const salida=.16; // Segundos de caída suave después de soltar la nota.
function contexto(){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return null;if(!contextoAudio)contextoAudio=new Audio();if(contextoAudio.state==='suspended')contextoAudio.resume();return contextoAudio}
function apagar(){if(!vozActual)return;const {oscilador,ganancia}=vozActual,ahora=contextoAudio.currentTime;ganancia.gain.cancelScheduledValues(ahora);ganancia.gain.setValueAtTime(Math.max(ganancia.gain.value,.0001),ahora);ganancia.gain.exponentialRampToValueAtTime(.0001,ahora+salida);oscilador.stop(ahora+salida+.02);vozActual=null}
function sonar(semitonos){const ctx=contexto();if(!ctx)return;apagar();const ahora=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type=$('timbre').value;o.frequency.value=frecuencias[$('tonica').value]*2**(semitonos/12);const intensidad=Math.max(.0001,Number($('volumen').value)/100*.30);g.gain.setValueAtTime(.0001,ahora);g.gain.exponentialRampToValueAtTime(intensidad,ahora+.025);o.connect(g);g.connect(ctx.destination);o.start(ahora);vozActual={oscilador:o,ganancia:g};o.onended=()=>{o.disconnect();g.disconnect()}}
function iniciar(fuente,nombre){if(pulsaciones.has(fuente))return;pulsaciones.set(fuente,nombre);mostrar(nombre);sonar(notas.find(n=>n[0]===nombre)[1])}
function terminar(fuente){if(!pulsaciones.has(fuente))return;const eraUltima=[...pulsaciones.keys()].at(-1)===fuente;pulsaciones.delete(fuente);if(eraUltima){apagar();if(pulsaciones.size){const anterior=[...pulsaciones.values()].at(-1);mostrar(anterior);sonar(notas.find(n=>n[0]===anterior)[1])}}}
function soltarTodo(){pulsaciones.clear();apagar()}
const atajos={'so.':'Alt+S','la.':'Alt+L','ti.':'Alt+T',do:'D',re:'R',mi:'M',fa:'F',so:'S',la:'L',ti:'T',"do'":'Mayús+D',"re'":'Mayús+R',"mi'":'Mayús+M',"fa'":'Mayús+F',"so'":'Mayús+S'};
const botones=new Map();
function mostrar(nombre){$('nota').textContent=nombre;$('emoji').textContent=notas.find(n=>n[0]===nombre)[2];$('ayuda').textContent='';$('display').classList.add('active');document.querySelectorAll('.keys button').forEach(b=>b.classList.toggle('selected',b===botones.get(nombre)))}
function asociarPuntero(boton,nombre){boton.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();boton.setPointerCapture(e.pointerId);iniciar('puntero:'+e.pointerId,nombre)});for(const tipo of ['pointerup','pointercancel','lostpointercapture'])boton.addEventListener(tipo,e=>terminar('puntero:'+e.pointerId))}
for(const [nombre] of notas){const boton=document.createElement('button');boton.type='button';boton.textContent=nombre;boton.title=atajos[nombre];boton.setAttribute('aria-label','Nota '+nombre+', atajo '+atajos[nombre]);botones.set(nombre,boton);asociarPuntero(boton,nombre);$('teclado').append(boton)}
const graves={s:'so.',l:'la.',t:'ti.'},centrales={d:'do',r:'re',m:'mi',f:'fa',s:'so',l:'la',t:'ti'},agudas={d:"do'",r:"re'",m:"mi'",f:"fa'",s:"so'"};
document.addEventListener('keydown',evento=>{if(evento.repeat||evento.ctrlKey||evento.metaKey||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;const tecla=evento.key.toLowerCase();const nombre=evento.altKey&&!evento.shiftKey?graves[tecla]:evento.shiftKey&&!evento.altKey?agudas[tecla]:!evento.altKey&&!evento.shiftKey?centrales[tecla]:null;if(nombre){evento.preventDefault();iniciar('tecla:'+evento.code,nombre)}});
document.addEventListener('keyup',evento=>terminar('tecla:'+evento.code));
window.addEventListener('blur',soltarTodo);
asociarPuntero($('escucharTonica'),'do');
$('volumen').oninput=()=>{$('valorVolumen').textContent=$('volumen').value+'%';if(vozActual){const ahora=contextoAudio.currentTime;vozActual.ganancia.gain.setTargetAtTime(Math.max(.0001,Number($('volumen').value)/100*.30),ahora,.02)}};
</script></body></html>
